<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Source for the social profile images; export each .board with a headless browser at its own size. -->
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=DM+Mono:wght@400;500&family=Onest:wght@400;500;600&family=Unbounded:wght@600;700&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #333; font-family: Onest, sans-serif; color: #1c1d21; }
  .board { position: relative; overflow: hidden; background: #141416; margin: 40px; }
  .card { position: absolute; overflow: hidden; }
  .mono { font-family: "DM Mono", monospace; letter-spacing: 0.02em; }
  .head { font-family: Unbounded; font-weight: 700; letter-spacing: -0.06em; line-height: 0.93; }
  .wordmark { font-family: Comfortaa; font-weight: 700; letter-spacing: -0.06em; white-space: nowrap; }
  .cut { filter: drop-shadow(0 30px 34px rgb(0 0 0 / 0.3)) drop-shadow(0 6px 10px rgb(0 0 0 / 0.18)); object-fit: contain; object-position: bottom; }
  .mark { position: absolute; border-radius: 50%; }
</style>
</head>
<body>

<!-- Profile picture, dark: the ring-and-dot mark (platforms crop it to a circle). -->
<div class="board" id="perfil-oscuro" style="width:1080px;height:1080px">
  <div class="mark" style="left:270px;top:270px;width:540px;height:540px;border:120px solid #ff6b00"></div>
  <div class="mark" style="left:700px;top:250px;width:150px;height:150px;background:#cbbeff"></div>
</div>

<!-- Profile picture, lavender. -->
<div class="board" id="perfil-lavanda" style="width:1080px;height:1080px;background:#cbbeff">
  <div class="mark" style="left:270px;top:270px;width:540px;height:540px;border:120px solid #141416"></div>
  <div class="mark" style="left:700px;top:250px;width:150px;height:150px;background:#ff6b00"></div>
</div>

<!-- Facebook cover, 1640x924. Desktop shows the middle 1640x624 band, mobile the whole image: the cards live in that band. -->
<div class="board" id="portada-facebook" style="width:1640px;height:924px">
  <div class="card" style="left:150px;top:170px;width:620px;height:584px;border-radius:44px;background:#cbbeff">
    <div class="mono" style="position:absolute;right:36px;top:30px;font-size:22px;color:#1c1d21aa">luzunido.co</div>
    <div class="wordmark" style="position:absolute;left:26px;bottom:-26px;font-size:190px;line-height:1;color:#1c1d21">luzunido</div>
  </div>
  <div class="card" style="left:786px;top:170px;width:400px;height:584px;border-radius:44px;background:#f5efe6">
    <div class="mono" style="position:absolute;left:34px;right:34px;top:30px;font-size:20px;color:#5d6068;display:flex;justify-content:space-between"><span>Luzunido</span><span>AIBIMY originales</span></div>
    <div class="head" style="position:absolute;left:34px;top:84px;font-size:64px">el sonido<br>también<br>se ve.</div>
    <div style="position:absolute;left:34px;bottom:34px;display:flex;align-items:center;gap:12px;background:#1c1d21;color:#fff;border-radius:999px;padding:16px 26px;font-size:22px;font-weight:600">Pídelo y paga al recibir</div>
  </div>
  <div class="card" style="left:1202px;top:170px;width:288px;height:584px;border-radius:44px;background:#fccfa8">
    <div style="position:absolute;left:30px;right:30px;top:120px;bottom:0;background:#bfd6f6;border-radius:200px 200px 0 0"></div>
    <img class="cut" src="../../../public/products/parlante-aibimy-my274bt-bluetooth-40w/front-34.webp" style="position:absolute;left:44px;width:200px;top:70px;height:480px">
    <div class="mono" style="position:absolute;left:28px;top:26px;font-size:20px;color:#1c1d21aa">MY274BT · 40 W</div>
  </div>
</div>

<!-- Instagram highlight covers, 1080x1920; Instagram shows the centre as a circle. -->
<div class="board hl" id="destacada-modelos" style="width:1080px;height:1920px;background:#cbbeff">
  <svg viewBox="0 0 24 24" style="position:absolute;left:390px;top:810px;width:300px;height:300px" fill="none" stroke="#1c1d21" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="3" width="11" height="18" rx="3"/><circle cx="12" cy="14" r="3"/><path d="M10.5 6.5h3"/></svg>
</div>
<div class="board hl" id="destacada-contraentrega" style="width:1080px;height:1920px;background:#fccfa8">
  <svg viewBox="0 0 24 24" style="position:absolute;left:390px;top:810px;width:300px;height:300px" fill="none" stroke="#1c1d21" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 9.5v5M18 9.5v5"/></svg>
</div>

</div>
<div class="board hl" id="destacada-preguntas" style="width:1080px;height:1920px;background:#fbc3d9">
  <svg viewBox="0 0 24 24" style="position:absolute;left:390px;top:810px;width:300px;height:300px" fill="none" stroke="#1c1d21" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.3M12 17h.01"/></svg>
</div>
<div class="board hl" id="destacada-garantia" style="width:1080px;height:1920px;background:#f5efe6">
  <svg viewBox="0 0 24 24" style="position:absolute;left:390px;top:810px;width:300px;height:300px" fill="none" stroke="#1c1d21" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.4-3 8.3-7 10-4-1.7-7-5.6-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>
</div>

</body>
</html>
